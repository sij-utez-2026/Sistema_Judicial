# Copia este archivo como correo.properties (en esta misma carpeta) y pon los datos de la cuenta que envía.
# correo.properties NO se sube a GitHub (está en .gitignore). Lo lee nucleo/correo/Correo.java.
#
# correo.activo=false: no se envía nada; el correo (con el enlace de recuperación) se escribe en la consola de Tomcat.
# correo.activo=true: se envía de verdad por SMTP.
#
# Con Gmail: activa la verificación en dos pasos de la cuenta y crea una "Contraseña de aplicación"
# (https://myaccount.google.com/apppasswords). Esa contraseña de 16 letras va en correo.password,
# NO la contraseña normal de la cuenta.
correo.activo=false
correo.host=smtp.gmail.com
correo.puerto=587
correo.usuario=
correo.password=
correo.remitente=Sistema Judicial Integral
# Dirección del sistema para los enlaces del correo, sin "/" al final. En el servidor real SIEMPRE se pone.
# Vacía = se usa la de la petición (sirve en desarrollo: http://localhost:8080/sij).
correo.url_sistema=
