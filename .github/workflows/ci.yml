name: ci
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compila, corre las pruebas y arma el .war. Las pruebas no usan MySQL.
      - run: chmod +x mvnw && ./mvnw -B verify
